<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artificial Eye</title>
</head>
<body style="margin:0; background:black;">

  <video id="video" autoplay playsinline style="width:100%; height:100vh; object-fit:cover;"></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <button id="captureBtn" style="
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    padding:20px 40px; font-size:18px; border-radius:16px; border:none;
    background:#8FB8FF; font-weight:bold;">
    Capture
  </button>
  <button id="settingsBtn" style="
    position:fixed; top:20px; right:20px;
    width:44px; height:44px; border-radius:50%; border:none;
    background:#1D1D27; color:white; font-size:20px;">
    ⚙️
  </button>

  <div id="settingsPanel" style="
    display:none; position:fixed; inset:0; background:#111; color:white;
    padding:24px; box-sizing:border-box; z-index:10;">
    <h2>Settings</h2>
    <label for="apiKeyInput" style="display:block; margin-bottom:8px;">Gemini API Key</label>
    <input id="apiKeyInput" type="text" placeholder="Paste your key here" style="
      width:100%; padding:12px; font-size:16px; border-radius:8px; border:none; box-sizing:border-box;">
    <button id="saveKeyBtn" style="
      margin-top:16px; padding:12px 24px; border-radius:8px; border:none;
      background:#8FB8FF; font-weight:bold;">
      Save
    </button>
    <button id="closeSettingsBtn" style="
      margin-top:16px; margin-left:12px; padding:12px 24px; border-radius:8px; border:none;
      background:#333; color:white;">
      Close
    </button>
  </div>
  <div id="modeRow" style="
    position:fixed; bottom:100px; left:0; right:0;
    display:flex; justify-content:center; gap:10px;">
    <button class="modeBtn" data-mode="scene" style="padding:10px 16px; border-radius:20px; border:none; background:#8FB8FF; font-weight:bold;">Scene</button>
    <button class="modeBtn" data-mode="text" style="padding:10px 16px; border-radius:20px; border:none; background:#333; color:white;">Read Text</button>
    <button class="modeBtn" data-mode="currency" style="padding:10px 16px; border-radius:20px; border:none; background:#333; color:white;">Currency</button>
    <button class="modeBtn" data-mode="road" style="padding:10px 16px; border-radius:20px; border:none; background:#333; color:white;">Road/Sign</button>
  </div>
  <script type="module">
    import { GoogleGenAI } from "https://esm.sh/@google/genai";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => {
        video.srcObject = stream;
      })
      .catch(err => {
        console.error("Camera error:", err);
        alert("Camera access failed: " + err.message);
      });

    let GEMINI_API_KEY = localStorage.getItem('geminiApiKey') || "";
    let ai = GEMINI_API_KEY ? new GoogleGenAI({ apiKey: GEMINI_API_KEY }) : null;
    const MODEL = "gemini-3.1-flash-lite";

    const PROMPTS = {
         scene: "Describe what's in front of me in 1-2 short sentences, focused on anything a blind person walking would need to know.",
        text: "Read aloud any text visible in this image (signs, labels, documents). If there's no text, say so in one short sentence.",
         currency: "Identify any currency notes or coins visible — denomination, currency, and how many. If none visible, say so in one short sentence.",
        road: "Describe road and safety information only: traffic signals, crosswalks, oncoming vehicles, curbs, and any street signs. Prioritize the most urgent hazard first. Keep it to 1-2 short sentences."
    };

let currentMode = "scene";

    async function analyzeImage(base64Image) {
      const response = await ai.models.generateContent({
        model: MODEL,
        contents: [
          {
            role: "user",
            parts: [
              { inlineData: { mimeType: "image/jpeg", data: base64Image } },
              { text: PROMPTS[currentMode] }
            ]
          }
        ]
      });
      return response.text;
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');

    settingsBtn.addEventListener('click', () => {
      apiKeyInput.value = GEMINI_API_KEY;
      settingsPanel.style.display = 'block';
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsPanel.style.display = 'none';
    });
    const modeButtons = document.querySelectorAll('.modeBtn');

    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        currentMode = btn.dataset.mode;

        modeButtons.forEach(b => {
          b.style.background = '#333';
          b.style.color = 'white';
        });
        btn.style.background = '#8FB8FF';
        btn.style.color = 'black';
      });
    });

    saveKeyBtn.addEventListener('click', () => {
      GEMINI_API_KEY = apiKeyInput.value.trim();
      localStorage.setItem('geminiApiKey', GEMINI_API_KEY);
      ai = new GoogleGenAI({ apiKey: GEMINI_API_KEY });
      settingsPanel.style.display = 'none';
      alert("API key saved.");
    });
   
    captureBtn.addEventListener('click', async () => {
      if (!ai) {
        alert("Please add your Gemini API key in Settings first.");
        settingsPanel.style.display = 'block';
        return;
      }
      const width = video.videoWidth;
      const height = video.videoHeight;
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, width, height);
      const imageData = canvas.toDataURL('image/jpeg', 0.8);
      const base64Only = imageData.split(',')[1];

      captureBtn.textContent = "Analyzing...";

      try {
        const description = await analyzeImage(base64Only);
        speak(description);
      } catch (err) {
        console.error("Analysis failed:", err);
        alert("Something went wrong: " + err.message);
      } finally {
        captureBtn.textContent = "Capture";
      }
    });
  </script>

</body>
</html>
