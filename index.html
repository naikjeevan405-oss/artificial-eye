<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artificial Eye</title>
</head>
<body style="margin:0; background:black;">

  <video id="video" autoplay playsinline style="width:100%; height:100vh; object-fit:cover;"></video>
<canvas id="canvas" style="display:none;"></canvas>

  <button id="captureBtn" style="
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    padding:20px 40px; font-size:18px; border-radius:16px; border:none;
    background:#8FB8FF; font-weight:bold;">
    Capture
  </button>
  <script>
    const video = document.getElementById('video');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => {
        video.srcObject = stream;
      })
      .catch(err => {
        console.error("Camera error:", err);
        alert("Camera access failed: " + err.message);
      });
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');

    
  const GEMINI_API_KEY = "[REDACTED_API_KEY]";
    const MODEL = "gemini-3.1-flash-lite";

    async function analyzeImage(base64Image) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;

      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": GEMINI_API_KEY
        },
        body: JSON.stringify({
          contents: [{
            parts: [
              { inline_data: { mime_type: "image/jpeg", data: base64Image } },
              { text: "Describe what's in front of me in 1-2 short sentences, focused on anything a blind person walking would need to know." }
            ]
          }]
        })
      });

      const data = await response.json();
      console.log("Gemini response:", data);
      return data.candidates[0].content.parts[0].text;
    }
    captureBtn.addEventListener('click', async () => {
      const width = video.videoWidth;
      const height = video.videoHeight;

      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, width, height);

      const imageData = canvas.toDataURL('image/jpeg', 0.8);
      const base64Only = imageData.split(',')[1]; // strip the "data:image/jpeg;base64," prefix

      captureBtn.textContent = "Analyzing...";
      const description = await analyzeImage(base64Only);
      captureBtn.textContent = "Capture";

      alert(description);
    });
  </script>

</body>
</html>
